<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body{
            margin:0;
            padding:0;
            background: linear-gradient(135deg,#667eea,#764ba2);
            font-family: Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        form{
            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
            width:260px;
            text-align:center;
        }
        input[type="text"]{
            width:100%;
            height:50px;
            font-size:22px;
            text-align:right;
            padding-right:10px;
            border:none;
            outline:none;
            border-radius:10px;
            background:#f3f3f3;
            margin-bottom:15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type="button"]{
            width:55px;
            height:45px;
            margin:5px;
            font-size:18px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            background:#667eea;
            color:white;
            transition:0.3s;
        }
        input[type="button"]:hover{
            background:#4c5bd4;
            transform:scale(1.05);
        }
        input[value="+"],
        input[value="-"],
        input[value="*"],
        input[value="/"]{
            background:#ff7a18;
        }
        input[value="+":hover],
        input[value="-":hover],
        input[value="*"]:hover,
        input[value="/"]:hover{
            background:#e5670f;
        }
        input[value="C"]{
            background:#ff4d4d;
        }
        input[value="C"]:hover{
            background:#e60000;
        }
    </style>
</head>
<body>
    <form name="f1" onsubmit="return false;">  
        <input type="text" name="t1" value="0" id="display" readonly> <br>
        <input type="button" value="1" onclick="appendValue('1')" name="b1"> 
        <input type="button" value="2" onclick="appendValue('2')" name="b2"> 
        <input type="button" value="3" onclick="appendValue('3')" name="b3">
        <input type="button" value="4" onclick="appendValue('4')" name="b5"> 
        <input type="button" value="5" onclick="appendValue('5')" name="b6">
        <input type="button" value="6" onclick="appendValue('6')" name="b7"> 
        <input type="button" value="7" onclick="appendValue('7')" name="b8">
        <input type="button" value="8" onclick="appendValue('8')" name="b9"> 
        <input type="button" value="9" onclick="appendValue('9')" name="b10"> 
        <input type="button" value="0" onclick="appendValue('0')" name="b11">
        <input type="button" value="+" onclick="appendOperator('+')" name="b4">
        <input type="button" value="-" onclick="appendOperator('-')" name="b12"> 
        <input type="button" value="*" onclick="appendOperator('*')" name="b13"> 
        <input type="button" value="=" onclick="calculate()" name="b14">
        <input type="button" value="/" onclick="appendOperator('/')" name="b15">
        <input type="button" value="C" onclick="clearDisplay()" name="b17">
    </form>

    <script>
        const display = document.getElementById('display');

        function appendValue(value) {
            if (display.value === '0') {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function appendOperator(operator) {
            const lastChar = display.value.slice(-1);
            if ('+-*/'.includes(lastChar)) {
                display.value = display.value.slice(0, -1) + operator;
            } else {
                display.value += operator;
            }
        }

        function calculate() {
            try {
                const result = eval(display.value || '0');
                display.value = Number.isFinite(result) ? result : 'Error';
            } catch (error) {
                display.value = 'Error';
            }
        }

        function clearDisplay() {
            display.value = '0';
        }
    </script>
</body>
</html>
